<title>School Support Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===================== TOKENS ===================== */
:root{
  --bg:#f5f2ea;
  --surface:#ffffff;
  --surface-2:#faf7f0;
  --surface-3:#f0ebdd;
  --ink:#20261f;
  --ink-muted:#5c6b57;
  --ink-faint:#8a9783;
  --border:#e1dcc8;
  --border-strong:#c9c2a6;
  --accent:#0e6e5c;
  --accent-ink:#ffffff;
  --accent-soft:#dcf0ea;
  --accent-warm:#9c6b12;
  --accent-warm-soft:#f7ecd6;
  --good:#2c7a3f;
  --good-soft:#e3f2e2;
  --warn:#9c6d04;
  --warn-soft:#f8f0d4;
  --risk:#ab3a3a;
  --risk-soft:#f8e3e0;
  --shadow-1:0 1px 2px rgba(23,35,59,.06), 0 1px 1px rgba(23,35,59,.04);
  --shadow-2:0 8px 24px rgba(23,35,59,.14), 0 2px 8px rgba(23,35,59,.08);
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:16px;
  --font-display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a13;
    --surface:#1c241b;
    --surface-2:#232c21;
    --surface-3:#2d372a;
    --ink:#eef2ea;
    --ink-muted:#aab5a5;
    --ink-faint:#77826f;
    --border:#33402f;
    --border-strong:#46543f;
    --accent:#5fc9ae;
    --accent-ink:#0f1a14;
    --accent-soft:#1c3730;
    --accent-warm:#e3b055;
    --accent-warm-soft:#3a2f16;
    --good:#6bc97e;
    --good-soft:#152c1a;
    --warn:#e8c25a;
    --warn-soft:#332a10;
    --risk:#e88379;
    --risk-soft:#3a1e18;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141a13;
  --surface:#1c241b;
  --surface-2:#232c21;
  --surface-3:#2d372a;
  --ink:#eef2ea;
  --ink-muted:#aab5a5;
  --ink-faint:#77826f;
  --border:#33402f;
  --border-strong:#46543f;
  --accent:#5fc9ae;
  --accent-ink:#0f1a14;
  --accent-soft:#1c3730;
  --accent-warm:#e3b055;
  --accent-warm-soft:#3a2f16;
  --good:#6bc97e;
  --good-soft:#152c1a;
  --warn:#e8c25a;
  --warn-soft:#332a10;
  --risk:#e88379;
  --risk-soft:#3a1e18;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 8px 28px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);}
a{color:var(--accent);}
.tnum{font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;text-wrap:balance;margin:0;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ===================== SHELL ===================== */
.app{max-width:1440px;margin:0 auto;padding:0 20px 48px;}

.topbar{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:18px 0 14px;border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(155deg,var(--accent),#0a2e26);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-1);
}
.brand-mark svg{width:21px;height:21px;color:#fff;}
.brand-eyebrow{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-faint);font-weight:600;margin-bottom:1px;
}
.brand-title{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.1;}

.topbar-actions{display:none;} /* sync status / manage-data controls hidden from the dashboard by request */
.sync-pill{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);
  padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;}
.sync-dot.offline{background:var(--ink-faint);}
.sync-dot.live{animation:pulse 2s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.sync-dot.live{animation:none;}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(35,122,75,.45);}50%{box-shadow:0 0 0 4px rgba(35,122,75,0);}}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-warm{background:var(--accent-warm);color:#fff;border-color:var(--accent-warm);}
.btn-warm:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn svg{width:14px;height:14px;flex:none;}

/* Tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;}
.tab-btn{
  padding:9px 15px 10px;font-size:13.5px;font-weight:600;color:var(--ink-muted);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tabs-row{background:var(--surface);border-bottom:1px solid var(--border);margin:0 -20px;padding:0 20px;}
.tabs-row .tabs{max-width:1440px;margin:0 auto;}

/* Filter bar */
.filterbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
  padding:14px 16px;margin:16px 0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-1);
}
.field{display:flex;flex-direction:column;gap:4px;min-width:140px;}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;}
.field select,.field input[type=text],.field input[type=search]{
  font-family:inherit;font-size:13px;padding:7px 9px;border-radius:7px;
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);
}
.field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.filterbar .spacer{flex:1;}
.asof{font-size:11.5px;color:var(--ink-faint);text-align:right;line-height:1.4;margin-right:4px;}

/* Panels */
.tabpanel{display:none;}
.tabpanel.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion:reduce){.tabpanel.active{animation:none;}}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap;}
.section-head h2{font-size:18px;}
.section-sub{font-size:12px;color:var(--ink-faint);}

/* Stat tiles */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.stat-tile{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-m);padding:14px 16px 15px;box-shadow:var(--shadow-1);
  overflow:hidden;
}
.stat-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tile-tone,var(--accent));}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
.stat-value{font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);}
.stat-value small{font-family:var(--font-body);font-size:13px;color:var(--ink-faint);font-weight:600;margin-left:2px;}
.stat-sub{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
.stat-tile.tone-good{--tile-tone:var(--good);}
.stat-tile.tone-warn{--tile-tone:var(--warn);}
.stat-tile.tone-risk{--tile-tone:var(--risk);}
.stat-tile.tone-warm{--tile-tone:var(--accent-warm);}

/* Cards / tables container */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-1);margin-top:14px;}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--border);}
.card-head h3{font-size:14.5px;font-family:var(--font-body);font-weight:700;}
.card-head .spacer{flex:1;}
.search-box{position:relative;}
.search-box input{padding:7px 10px 7px 28px;font-size:12.5px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);min-width:190px;}
.search-box svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-faint);}
.toggle-btn{
  font-size:12px;font-weight:600;padding:6px 11px;border-radius:7px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--ink-muted);cursor:pointer;
}
.toggle-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.table-scroll{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:12.8px;}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--ink);}
thead th .arrow{opacity:.5;font-size:9px;margin-left:3px;}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--ink);}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-family:var(--font-mono);}
.rowname{font-weight:600;}
.rowmuted{color:var(--ink-faint);font-size:11.5px;}
.thead-domain th{background:var(--surface-3);font-size:10px;text-align:center;padding:6px;border-bottom:1px solid var(--border);}
.thead-domain th.lit{background:var(--accent-soft);color:var(--accent);}
.thead-domain th.num-domain{background:var(--accent-warm-soft);color:var(--accent-warm);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-risk{background:var(--risk-soft);color:var(--risk);}
.badge-neutral{background:var(--surface-3);color:var(--ink-muted);}
.badge-zero{background:#4a2327;color:#fbe9e7;}
.band-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-muted);}
.band-legend span.k{display:inline-flex;align-items:center;gap:6px;}
.band-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-muted);margin:1px 0;white-space:nowrap;}
.chip b{font-weight:700;color:var(--ink);}
.chip.lit{background:var(--accent-soft);color:var(--accent);}
.chip.num-chip{background:var(--accent-warm-soft);color:var(--accent-warm);}

.qmark{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.qmark.y{background:var(--good-soft);color:var(--good);}
.qmark.n{background:var(--risk-soft);color:var(--risk);}

.pctbar{position:relative;width:70px;height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px;}
.pctbar > span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);}

.heat-cell{text-align:center;font-family:var(--font-mono);font-weight:600;font-size:12px;border-radius:5px;padding:6px 4px !important;}

.empty-note{padding:26px 16px;text-align:center;color:var(--ink-faint);font-size:13px;}
.foot-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:11.5px;color:var(--ink-faint);flex-wrap:wrap;gap:8px;}
.pager{display:flex;align-items:center;gap:8px;}
.pager button{padding:4px 9px;font-size:12px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer;}
.pager button:disabled{opacity:.4;cursor:default;}

.competency-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:860px){.competency-grid{grid-template-columns:1fr;}}
.bar-row{display:grid;grid-template-columns:170px 1fr 46px;align-items:center;gap:10px;padding:6px 0;}
.bar-row .label{font-size:12.3px;color:var(--ink);}
.bar-track{height:15px;border-radius:5px;background:var(--surface-3);position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}
.bar-row .val{font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--ink-muted);}
.domain-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:2px 0 6px;display:flex;align-items:center;gap:6px;}
.domain-title.lit{color:var(--accent);}
.domain-title.num-domain{color:var(--accent-warm);}
.domain-title::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor;}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(15,22,38,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40;}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);background:var(--surface);
  box-shadow:var(--shadow-2);transform:translateX(100%);transition:transform .22s ease;z-index:41;
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);}
.drawer-head h3{font-family:var(--font-display);font-size:18px;}
.drawer-body{padding:18px;overflow-y:auto;flex:1;}
.drawer-section{margin-bottom:26px;}
.drawer-section h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:0 0 10px;}
.dropzone{
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-m);padding:22px 14px;text-align:center;
  color:var(--ink-muted);font-size:12.5px;cursor:pointer;background:var(--surface-2);
}
.dropzone:hover{border-color:var(--accent);color:var(--accent);}
.dropzone svg{width:22px;height:22px;margin-bottom:6px;color:var(--ink-faint);}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
.file-preview{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin-top:10px;background:var(--surface-2);}
.file-preview .fp-name{font-weight:700;font-size:12.8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.file-preview .fp-rounds{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
.form-row{display:flex;flex-direction:column;gap:4px;margin-top:10px;}
.form-row label{font-size:11px;font-weight:600;color:var(--ink-muted);}
.form-row input[type=text],.form-row input[type=number],.form-row select{
  font-family:inherit;font-size:13px;padding:7px 9px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
}
.arp-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.arp-row:last-child{border-bottom:none;}
.arp-row .ai{flex:1;min-width:0;}
.arp-row .ai .nm{font-weight:700;font-size:12.8px;}
.arp-row .ai .mt{font-size:11px;color:var(--ink-faint);}
.arp-row select,.arp-row input{font-size:12px;padding:5px 7px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);width:118px;}
.threshold-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.close-x{margin-left:auto;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;border-radius:6px;}
.close-x:hover{background:var(--surface-2);color:var(--ink);}
.close-x svg{width:18px;height:18px;}

@media print{
  .topbar-actions,.filterbar,.tabs,.card-head .search-box,.card-head .toggle-btn,.foot-row .pager,.drawer,.overlay{display:none !important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #999;}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">

      </div>
      <div>
        <div class="brand-eyebrow">NIPUN Bharat Mission &middot; FLN Field Dashboard</div>

      </button>

  <div class="tabs-row">

      <label for="fPeriod">Period</label>
      <select id="fPeriod"></select>
    </div>
    <div class="spacer"></div>
  </div>

  <main>
    <section class="tabpanel active" id="tab-overview"></section>
    <section class="tabpanel" id="tab-block"></section>
    <section class="tabpanel" id="tab-school"></section>
    <section class="tabpanel" id="tab-student"></section>
    <section class="tabpanel" id="tab-competency"></section>
    <section class="tabpanel" id="tab-myreport"></section>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Sync &amp; Import</h3>
    <button class="close-x" id="drawerClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>

function sortRows(arr, key, dir){
  arr.sort(function(a,b){
    var av=getPath(a,key), bv=getPath(b,key);
    if(typeof av==='string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
    if(av<bv) return dir==='asc'?-1:1;
    if(av>bv) return dir==='asc'?1:-1;
    return 0;
  });
  return arr;
}

/* ===================== RENDER: FILTER BAR ===================== */
function renderFilterOptions(){
  var rounds = distinctRounds().sort();
  var blocks = distinctBlocks();
  var arpsAll = allArpEntries().sort(function(a,b){return a.name.localeCompare(b.name);});
  var arpsInBlock = state.filters.block==='all' ? arpsAll : arpsAll.filter(function(a){return a.block===state.filters.block;});

  var pEl = document.getElementById('fPeriod');
  var curP = state.filters.period;
  pEl.innerHTML = '<option value="all">All rounds</option>' + rounds.map(function(r){return '<option value="'+esc(r)+'"'+(r===curP?' selected':'')+'>'+esc(r)+'</option>';}).join('');
  if(!rounds.includes(curP) && curP!=='all'){ state.filters.period='all'; pEl.value='all'; }

  var bEl = document.getElementById('fBlock');
  var curB = state.filters.block;
  bEl.innerHTML = '<option value="all">All blocks</option>' + blocks.map(function(b){return '<option value="'+esc(b)+'"'+(b===curB?' selected':'')+'>'+esc(b)+'</option>';}).join('');

  var aEl = document.getElementById('fArp');
  var curA = state.filters.arp;
  var stillValid = arpsInBlock.some(function(a){return a.id===curA;});
  if(!stillValid) { curA='all'; state.filters.arp='all'; }
  aEl.innerHTML = '<option value="all">All ARPs</option>' + arpsInBlock.map(function(a){return '<option value="'+esc(a.id)+'"'+(a.id===curA?' selected':'')+'>'+esc(a.name)+'</option>';}).join('');

  var allRowsForSchools = flattenStudents();
  var schoolsPool = allRowsForSchools.filter(function(r){
    if(state.filters.block!=='all' && r.block!==state.filters.block) return false;
    if(state.filters.arp!=='all' && r.arpId!==state.filters.arp) return false;
    return true;
  });
  var schoolSet = {};
  schoolsPool.forEach(function(r){ schoolSet[r.school]=true; });
  var schools = Object.keys(schoolSet).sort();
  var sEl = document.getElementById('fSchool');
  var curS = state.filters.school;
  if(!schools.includes(curS) && curS!=='all'){ curS='all'; state.filters.school='all'; }
  sEl.innerHTML = '<option value="all">All schools</option>' + schools.map(function(s){return '<option value="'+esc(s)+'"'+(s===curS?' selected':'')+'>'+esc(titleCase(s))+'</option>';}).join('');
}
function titleCase(s){
  return String(s||'').toLowerCase().replace(/\b\w/g, function(c){return c.toUpperCase();});
}

  html += statTile('Students Screened', a.totalStudents, 'across '+a.schoolsCovered+' schools', '');
  html += statTile('ARPs Reporting', arpCount+'<small>/'+targetArps+'</small>', Math.round(pct(arpCount,targetArps))+'% of Ghaziabad roster', 'warm');

  html += th('Literacy %','litPct',true)+th('Numeracy %','numPct',true)+th('Focus Schools','highPriority',true);

    html += '<tr><td colspan="11"><div class="empty-note">No data for the current filters yet. Use “Sync &amp; Import” to import an ARP’s Google Sheet export.</div></td></tr>';

    html += '<tr>';

function countHighPrioritySchools(rows){
  var bySchool = groupBy(rows, function(r){return r.arpId+'::'+r.school;});
  var count=0;
  Object.keys(bySchool).forEach(function(k){
    var g = aggRows(bySchool[k]);
    if(g.nipunPct < 50) count++;
  });
  return count;
}
function statTile(label, value, sub, tone){
  return '<div class="stat-tile'+(tone?' tone-'+tone:'')+'"><div class="stat-label">'+esc(label)+'</div>'+
    '<div class="stat-value tnum">'+value+'</div><div class="stat-sub">'+esc(sub)+'</div></div>';
}
function sectionHead(title, sub){
  return '<div class="section-head"><h2>'+esc(title)+'</h2><span class="section-sub">'+esc(sub)+'</span></div>';
}
function sortArrow(sortState, key){
  if(!key || sortState.key!==key) return '<span class="arrow"></span>';
  return '<span class="arrow">'+(sortState.dir==='asc'?'▲':'▼')+'</span>';
}
function th(label,key,numeric){
  var cls = key ? 'sortable' : '';
  return '<th class="'+cls+(numeric?' num':'')+'"'+(key?(' onclick="App.sortTable(\''+key+'\')"'):'')+'>'+esc(label)+(key?sortArrow(state.ui.sortOverview,key):'')+'</th>';
}

    var g = aggRows(srows);
    var pr = priorityOf(g.nipunPct);

    var weakLit = weakestIn(compAgg, LIT_KEYS);
    var weakNum = weakestIn(compAgg, NUM_KEYS);

      key:k, arpId:srows[0].arpId, arp:srows[0].arp, block:srows[0].block, school:srows[0].school, udise:srows[0].udise,

      nipunPct:g.nipunPct, approachingPct:g.approachingPct, atriskPct:g.atriskPct,
      litPct:g.litPct, numPct:g.numPct, priority:pr, compAgg:compAgg, weakLit:weakLit, weakNum:weakNum
    };
  });
  var q = state.ui.schoolSearch.trim().toLowerCase();

  html += '<button class="toggle-btn'+(state.ui.schoolShowUdise?' on':'')+'" id="toggleUdise">'+(state.ui.schoolShowUdise?'Hide':'Show')+' UDISE</button>';
  html += '<button class="toggle-btn'+(state.ui.schoolShowSubject?' on':'')+'" id="toggleSubject">'+(state.ui.schoolShowSubject?'Hide':'Show')+' subject detail</button>';
  html += '<div class="spacer"></div>';
  html += '<button class="btn btn-sm" onclick="App.exportCsv(\'school\')">Export CSV</button>';
  html += '<button class="btn btn-sm" onclick="window.print()">Print</button>';
  html += '</div>';

  html += '<div class="table-scroll"><table id="schoolTable"><thead>';
  if(state.ui.schoolShowSubject){
    html += '<tr class="thead-domain"><th colspan="'+(state.ui.schoolShowUdise?10:9)+'"></th><th colspan="4" class="lit">Literacy</th><th colspan="6" class="num-domain">Numeracy</th></tr>';
  }
  html += '<tr>';
  html += th('#','')+thS('School','school')+(state.ui.schoolShowUdise? thS('UDISE','udise'):'')+thS('ARP','arp')+thS('Block','block')+thS('Priority','priority.label')+thS('Students','students',true)+thS('NIPUN','nipunPct',true)+thS('Approaching','approachingPct',true)+thS('At Risk','atriskPct',true);
  if(state.ui.schoolShowSubject){

function weakestIn(compAgg, keys){
  var worst=null;
  keys.forEach(function(k){
    var c = COMPETENCIES.find(function(x){return x.key===k;});
    var v = compAgg[k].pct;
    if(worst===null || v < worst.pct){ worst = {key:k, short:c.short, label:c.label, pct:v}; }
  });
  return worst;
}
function thS(label,key,numeric){
  var cls = key?'sortable':'';
  return '<th class="'+cls+(numeric?' num':'')+'"'+(key?(' onclick="App.sortSchoolTable(\''+key+'\')"'):'')+'>'+esc(label)+(key?sortArrow(state.ui.sortSchool,key):'')+'</th>';
}
function attachSchoolHandlers(){
  var s = document.getElementById('schoolSearch');
  if(s) s.addEventListener('input', debounce(function(e){ state.ui.schoolSearch = e.target.value; renderPreservingFocus(); }, 250));
  var tU = document.getElementById('toggleUdise');
  if(tU) tU.addEventListener('click', function(){ state.ui.schoolShowUdise = !state.ui.schoolShowUdise; renderActive(); });
  var tS = document.getElementById('toggleSubject');
  if(tS) tS.addEventListener('click', function(){ state.ui.schoolShowSubject = !state.ui.schoolShowSubject; renderActive(); });
}

/* ===================== RENDER: STUDENT LEVEL ===================== */
function renderStudent(rows){
  var q = state.ui.studentSearch.trim().toLowerCase();
  var filtered = rows.filter(function(r){
    if(state.ui.studentClass!=='all' && r.cls!==state.ui.studentClass) return false;
    if(q && r.name.toLowerCase().indexOf(q)<0 && r.school.toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var a = aggRows(filtered);
  var pageSize = state.ui.studentPageSize;
  var totalPages = Math.max(1, Math.ceil(filtered.length/pageSize));
  if(state.ui.studentPage>totalPages) state.ui.studentPage = totalPages;
  var startIdx = (state.ui.studentPage-1)*pageSize;
  var pageRows = filtered.slice(startIdx, startIdx+pageSize);

  var html = '';
  html += '<div class="stat-row">';
  html += statTile('Students (filtered)', filtered.length, '', 'warm');
  html += statTile('NIPUN', a.nipun, Math.round(a.nipunPct)+'%', 'good');
  html += statTile('Approaching', a.approaching, Math.round(a.approachingPct)+'%', 'warn');
  html += statTile('At Risk', a.atrisk, Math.round(a.atriskPct)+'%', 'risk');
  html += '</div>';

  html += sectionHead('Student roster','');
  html += '<div class="card"><div class="card-head"><h3>Students</h3>';
  html += '<div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" id="studentSearch" placeholder="Search name or school" value="'+esc(state.ui.studentSearch)+'"></div>';
  html += '<select id="studentClassFilter" style="font-size:12.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);">';
  ['all','nipun','approaching','atrisk'].forEach(function(c){
    var label = c==='all'?'All classifications':c==='nipun'?'NIPUN':c==='approaching'?'Approaching':'At Risk';
    html += '<option value="'+c+'"'+(state.ui.studentClass===c?' selected':'')+'>'+label+'</option>';
  });
  html += '</select>';
  html += '<div class="spacer"></div>';
  html += '<button class="btn btn-sm" onclick="App.exportCsv(\'student\')">Export CSV</button>';
  html += '<button class="btn btn-sm" onclick="window.print()">Print</button>';
  html += '</div>';

  html += '<div class="table-scroll"><table><thead><tr>';
  html += '<th>#</th><th>Student</th><th>School</th><th>ARP</th><th>Block</th>';
  COMPETENCIES.forEach(function(c){ html += '<th title="'+esc(c.label)+'">'+c.key.toUpperCase()+'</th>'; });
  html += '<th class="num">Literacy %</th><th class="num">Numeracy %</th><th class="num">Overall %</th><th>Status</th>';
  html += '</tr></thead><tbody>';
  if(pageRows.length===0){
    html += '<tr><td colspan="19"><div class="empty-note">No students match the current filters.</div></td></tr>';
  }
  pageRows.forEach(function(r,i){
    html += '<tr><td class="rowmuted">'+(startIdx+i+1)+'</td><td class="rowname">'+esc(r.name)+'</td><td>'+esc(titleCase(r.school))+'</td><td>'+esc(r.arp)+'</td><td>'+esc(r.block)+'</td>';
    COMPETENCIES.forEach(function(c,ci){
      var v = r.answers[ci]===1;
      html += '<td><span class="qmark '+(v?'y':'n')+'" title="'+esc(c.label)+'">'+(v?'✓':'✕')+'</span></td>';
    });
    html += '<td class="num">'+Math.round(r.litPct)+'%</td><td class="num">'+Math.round(r.numPct)+'%</td><td class="num">'+Math.round(r.overallPct)+'%</td>';
    html += '<td>'+classBadge(r.cls)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="foot-row"><span>Showing '+(filtered.length? (startIdx+1)+'–'+Math.min(startIdx+pageSize,filtered.length):'0')+' of '+filtered.length+'</span>';
  html += '<div class="pager"><button id="pgPrev" '+(state.ui.studentPage<=1?'disabled':'')+'>← Prev</button><span class="tnum">Page '+state.ui.studentPage+' / '+totalPages+'</span><button id="pgNext" '+(state.ui.studentPage>=totalPages?'disabled':'')+'>Next →</button></div></div>';
  html += '</div>';

  document.getElementById('tab-student').innerHTML = html;
  window.__studentData = filtered;
  attachStudentHandlers();

/* ===================== MY SCHOOLS (per-ARP, per-month weak-competency report) ==========
   Independent of the global filter bar — an ARP just picks themself + a month and gets
   every student across their adopted schools, with the earliest skill (Q1→Q10 order)
   they have not yet passed. That's a proxy for "where to start" with that child, not a
   claim that later-numbered items are unaffected — a student can fail several items. */
function weakestCompetencyForStudent(answers){
  for(var i=0;i<COMPETENCIES.length;i++){
    if(answers[i]!==1) return COMPETENCIES[i];
  }
  return null; // passed all 10
}
// Performance band (per the SSP legend): Saksham >=80%, Pragatisheel 51-79%,
// Sangharsheel <=50%, Zero Scorer = 0 correct out of 10.
function performanceBand(r){
  if(r.correct === 0) return 'zero';
  if(r.overallPct >= 80) return 'saksham';
  if(r.overallPct > 50) return 'pragatisheel';
  return 'sangharsheel';
}
var BAND_LABEL = {saksham:'Saksham', pragatisheel:'Pragatisheel', sangharsheel:'Sangharsheel', zero:'Zero Scorer'};
function bandBadge(b){
  var cls = b==='saksham' ? 'badge-good' : b==='pragatisheel' ? 'badge-warn' : b==='sangharsheel' ? 'badge-risk' : 'badge-zero';
  return '<span class="badge '+cls+'">'+BAND_LABEL[b]+'</span>';
}

function download(filename, text){
  // Plain browser download (works on GitHub Pages / any static host).
  // state.downloads is kept only in case this file is ever reopened inside
  // a Claude artifact context that provides that capability.
  if(state.downloads && typeof state.downloads.save==='function'){
    state.downloads.save({filename:filename, data:new Blob([text],{type:'text/csv'})}).catch(function(err){
      if(err && err.code!=='declined') alert('Could not save the file: '+(err.message||err.code||err));
    });
    return;
  }
  try{
    var blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(err){
    alert('Could not download the file: '+(err.message||err));
  }
}
function tableToCsv(headers, rows){
  var lines = [headers.map(csvCell).join(',')];
  rows.forEach(function(r){ lines.push(r.map(csvCell).join(',')); });

}

/* ===================== EXCEL INGEST ===================== */
function parseWorkbookFile(file){
  return file.arrayBuffer().then(function(buf){
    var wb = XLSX.read(buf, {type:'array', cellDates:false});
    var rounds = [];
    wb.SheetNames.forEach(function(sheetName){
      var ws = wb.Sheets[sheetName];
      if(!ws || !ws['!ref']) return;
      var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      var headerRowIdx = -1, q1Col=-1;
      for(var r=0;r<Math.min(aoa.length,10);r++){
        var row = aoa[r]||[];
        for(var c=0;c<row.length;c++){
          if(String(row[c]||'').trim()==='Q1'){ headerRowIdx=r; q1Col=c; break; }
        }
        if(headerRowIdx>=0) break;
      }
      if(headerRowIdx<0) return; // not a data sheet
      var schoolCol=q1Col-4, udiseCol=q1Col-3, enrollCol=q1Col-2, nameCol=q1Col-1;
      if(schoolCol<0||nameCol<0) return;
      var dataStart = headerRowIdx+2; // skip full-text competency row
      var students = [];
      var curSchool='', curUdise='', curEnroll='';
      for(var i=dataStart;i<aoa.length;i++){
        var row = aoa[i]||[];
        var sVal = row[schoolCol], uVal = row[udiseCol], eVal = row[enrollCol], nVal = row[nameCol];
        if(sVal!=null && String(sVal).trim()!=='') curSchool = String(sVal).trim();
        if(uVal!=null && String(uVal).trim()!=='') curUdise = formatUdise(uVal);
        if(eVal!=null && String(eVal).trim()!=='') curEnroll = Math.round(Number(eVal))||eVal;
        if(nVal==null || String(nVal).trim()==='') continue;
        var answers = [];
        for(var k=0;k<10;k++){
          var v = row[q1Col+k];
          answers.push(Number(v)===1 ? 1 : 0);
        }
        students.push({school:curSchool, udise:curUdise, enrollment:curEnroll, name:String(nVal).trim(), answers:answers});
      }
      if(students.length>0) rounds.push({round:sheetName, students:students});
    });
    return rounds;
  });
}
function formatUdise(v){
  if(typeof v==='number'){
    var s = String(Math.round(v));
    return s.length<11 ? ('0'+s) : s;
  }
  return String(v).trim();
}
function defaultArpNameFromFilename(filename){
  var name = filename.replace(/\.[^/.]+$/,'');
  name = name.replace(/^RJP[_\-\s]*/i,'').replace(/[_\-]+/g,' ').trim();
  return name || filename;
}

/* ===================== DB LAYER ===================== */
function saveArpMeta(arpId, patch){
  if(!state.arps[arpId]) state.arps[arpId] = {name:arpId, block:'Unassigned'};
  Object.assign(state.arps[arpId], patch);
  if(state.db){
    var body = {}; body[arpId] = state.arps[arpId];
    state.db.doc('config/arps').get().then(function(snap){
      var op = snap.exists ? 'update' : 'set';
      var call = op==='update' ? state.db.doc('config/arps').update(body) : state.db.doc('config/arps').set(body);
      return call;
    }).catch(function(e){ console.warn('saveArpMeta failed', e); });
  }
  renderActive();
}
function saveSettings(s){
  state.settings = Object.assign({}, state.settings, s);
  if(state.db){
    state.db.doc('config/settings').get().then(function(snap){
      return snap.exists ? state.db.doc('config/settings').update(s) : state.db.doc('config/settings').set(state.settings);
    }).catch(function(e){ console.warn('saveSettings failed', e); });
  }
  renderActive();
  renderDrawer();
}
function importRounds(arpId, arpName, block, rounds){
  state.arps[arpId] = state.arps[arpId] || {};
  state.arps[arpId].name = arpName;
  state.arps[arpId].block = block;
  rounds.forEach(function(r){
    var docId = arpId+'__'+slugify(r.round);
    var body = {arpId:arpId, arp:arpName, block:block, round:r.round, students:r.students, uploadedAt:new Date().toISOString()};
    state.assessments[docId] = body;
    if(state.db){
      state.db.doc('assessments/'+docId).set(body).catch(function(e){ console.warn('import set failed', e); });
    }
  });
  if(state.db){
    state.db.doc('config/arps').get().then(function(snap){
      var body = {}; body[arpId] = state.arps[arpId];
      return snap.exists ? state.db.doc('config/arps').update(body) : state.db.doc('config/arps').set(body);
    }).catch(function(e){ console.warn('arp meta save failed', e); });
  }
  renderActive();
  renderDrawer();
}
function deleteRound(docId){
  delete state.assessments[docId];
  if(state.db){ state.db.doc('assessments/'+docId).delete().catch(function(e){ console.warn('delete failed', e); }); }
  renderActive();
  renderDrawer();
}

/* ===================== APP (exposed for inline handlers) ===================== */
window.App = {
  sortTable:function(key){ toggleSort(state.ui.sortOverview, key); renderActive(); },
  sortBlockTable:function(key){ toggleSort(state.ui.sortBlock, key); renderActive(); },
  sortSchoolTable:function(key){ toggleSort(state.ui.sortSchool, key); renderActive(); },
  setMyReport:function(field, value){ state.myReport[field] = value; renderActive(); },
  exportCsv:function(which){
    if(which==='overview'){
      var headers=['ARP','Block','Schools Reached','Students','NIPUN %','Approaching %','At Risk %','Literacy %','Numeracy %','Focus Schools'];
      var rows=(window.__overviewData||[]).map(function(r){return [r.name,r.block,r.schoolsCovered,r.students,Math.round(r.nipunPct),Math.round(r.approachingPct),Math.round(r.atriskPct),round1(r.litPct),round1(r.numPct),r.highPriority];});
      download('ssp_ghaziabad_overview.csv', tableToCsv(headers, rows));
    } else if(which==='block'){
      var headers2=['Block','ARPs','Schools Reached','Students','NIPUN %','Approaching %','At Risk %','Literacy %','Numeracy %','Focus Schools'];
      var rows2=(window.__blockData||[]).map(function(r){return [r.block,r.arps,r.schoolsCovered,r.students,Math.round(r.nipunPct),Math.round(r.approachingPct),Math.round(r.atriskPct),round1(r.litPct),round1(r.numPct),r.highPriority];});
      download('ssp_ghaziabad_blocks.csv', tableToCsv(headers2, rows2));
    } else if(which==='school'){
      var headers3=['School','UDISE','ARP','Block','Priority','Students','NIPUN %','Approaching %','At Risk %','Literacy %','Numeracy %','Weak Literacy Item','Weak Numeracy Item'];
      var rows3=(window.__schoolData||[]).map(function(s){return [titleCase(s.school),s.udise,s.arp,s.block,s.priority.label,s.students,Math.round(s.nipunPct),Math.round(s.approachingPct),Math.round(s.atriskPct),round1(s.litPct),round1(s.numPct),s.weakLit.short,s.weakNum.short];});
      download('ssp_ghaziabad_schools.csv', tableToCsv(headers3, rows3));
    } else if(which==='student'){
      var headers4=['Student','School','ARP','Block'].concat(COMPETENCIES.map(function(c){return c.key.toUpperCase();})).concat(['Literacy %','Numeracy %','Overall %','Status']);
      var rows4=(window.__studentData||[]).map(function(r){
        return [r.name, titleCase(r.school), r.arp, r.block].concat(r.answers).concat([Math.round(r.litPct),Math.round(r.numPct),Math.round(r.overallPct), r.cls]);
      });
      download('ssp_ghaziabad_students.csv', tableToCsv(headers4, rows4));
    } else if(which==='heatmap'){
      var d = window.__competencyData;
      if(!d) return;
      var headers5 = ['ARP','Students'].concat(COMPETENCIES.map(function(c){return c.key.toUpperCase();}));
      var rows5 = d.heat.arpIds.map(function(id){
        var arows = d.heat.byArp[id];
        var ca = competencyAgg(arows);
        var name = (state.arps[id]&&state.arps[id].name) || id;
        return [name, arows.length].concat(COMPETENCIES.map(function(c){return Math.round(ca[c.key].pct);}));
      });
      download('ssp_ghaziabad_competency_heatmap.csv', tableToCsv(headers5, rows5));
    } else if(which==='myreport'){
      var sel = state.myReport;
      if(!sel.arp || !sel.round) return;
      var headers6 = ['School','Student','Performance Band','Weakest Competency','Weakest Competency (Hindi)','All Gaps This Month','Literacy %','Numeracy %','Overall %','Status'];
      var rows6 = (window.__myReportData||[]).map(function(r){
        var weak = weakestCompetencyForStudent(r.answers);
        var gaps = COMPETENCIES.filter(function(c,i){ return r.answers[i]!==1; }).map(function(c){return c.short;}).join(' | ');
        return [titleCase(r.school), r.name, BAND_LABEL[performanceBand(r)], weak?weak.short:'All competencies passed', weak?weak.hindi:'', gaps||'None', round1(r.litPct), round1(r.numPct), Math.round(r.overallPct), r.cls];
      });
      var arpName = (state.arps[sel.arp]&&state.arps[sel.arp].name) || sel.arp;
      download('ssp_'+slugify(arpName)+'_'+slugify(sel.round)+'_student_report.csv', tableToCsv(headers6, rows6));
    }
  }
};

/* ===================== INIT ===================== */
function seedFallback(){
  state.assessments = {};
  SEED_ASSESSMENTS.forEach(function(doc, i){
    state.assessments[doc.arpId+'__'+slugify(doc.round)+'__'+i] = doc;
  });
  state.arps = SEED_ARPS;
}

function subscribeDb(db){
  state.db = db;
  db.collection('assessments').limit(500).onSnapshot(function(snap){
    var map = {};
    snap.docs.forEach(function(d){ map[d.id] = d.data(); });
    state.assessments = map;
    setSyncStatus(true);
    renderActive();
    if(drawer.classList.contains('show')) renderDrawer();
  }, function(err){ console.warn('assessments sub error', err); setSyncStatus(false); });

  db.doc('config/arps').onSnapshot(function(snap){
    state.arps = snap.exists ? (snap.data()||{}) : {};
    renderActive();
    if(drawer.classList.contains('show')) renderDrawer();
  }, function(err){ console.warn('arps sub error', err); });

  db.doc('config/settings').onSnapshot(function(snap){
    state.settings = snap.exists ? Object.assign({}, DEFAULT_SETTINGS, snap.data()) : Object.assign({}, DEFAULT_SETTINGS);
    renderActive();
  }, function(err){ console.warn('settings sub error', err); });
}
function setSyncStatus(live){
  var dot = document.getElementById('syncDot'), label = document.getElementById('syncLabel');
  if(live){ dot.className='sync-dot live'; label.textContent='Live data · synced'; }
  else { dot.className='sync-dot offline'; label.textContent='Demo dataset (sample)'; }
}

// ============================================================
// Apps Script data source (replaces the old Claude-artifact
// window.claude.use('db') live database).
//
// Point this at your existing SSP_Dashboard_API.gs Web App URL,
// with ?mode=legacy appended so it returns data in the shape this
// dashboard expects (assessments / arps / settings).
// ============================================================
var SSP_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypwdUwxgvvgyOPNovnX1m0e4v7pO5wS5LObjSDrLjTTRDVHhFnrqGnoNA_POq3chVehQ/exec?mode=legacy';
var SSP_REFRESH_MS = 5 * 60 * 1000; // re-poll every 5 minutes

function loadFromAppsScript(){
  fetch(SSP_APPS_SCRIPT_URL)
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      if (data && data.error) { console.warn('Apps Script error:', data.error); setSyncStatus(false); return; }
      state.assessments = data.assessments || {};
      state.arps = data.arps || {};
      state.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
      setSyncStatus(true);
      renderActive();
      if(drawer.classList.contains('show')) renderDrawer();
    })
    .catch(function(e){ console.warn('Apps Script fetch failed', e); setSyncStatus(false); });
}

(function init(){
  seedFallback(); // paint immediately with sample data while the real fetch resolves
  renderActive();

  if(!SSP_APPS_SCRIPT_URL || SSP_APPS_SCRIPT_URL.indexOf('PASTE_') === 0){
    setSyncStatus(false);
    return;
  }
  loadFromAppsScript();
  setInterval(loadFromAppsScript, SSP_REFRESH_MS);
})();

})();
